<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>测试数据加载</title>
</head>
<body>
  <h1>数据加载测试</h1>
  <div id="result"></div>

  <script src="recipes-data-100.js"></script>
  <script>
    const result = document.getElementById('result');

    if (window.RECIPES_DATA) {
      result.innerHTML = `
        <p>✅ 数据加载成功！</p>
        <p>总共 ${RECIPES_DATA.length} 道菜</p>
        <p>第一道菜：${RECIPES_DATA[0].name}</p>
        <p>食材：${RECIPES_DATA[0].ingredients.join(', ')}</p>
        <hr>
        <h2>测试匹配「番茄」</h2>
        <p>结果：</p>
        <ul>
          ${RECIPES_DATA.filter(r =>
            r.ingredients.some(ing => ing.includes('番茄') || '番茄'.includes(ing))
          ).map(r => `<li>${r.name} - ${r.ingredients.join(', ')}</li>`).join('')}
        </ul>
      `;
    } else {
      result.innerHTML = '<p style="color:red;">❌ 数据加载失败！</p>';
    }
  </script>
</body>
</html>
